<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="A penguin waddling across the ice">
<defs><linearGradient id="fs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<clipPath id="fc"><rect width="1280" height="170" rx="24"/></clipPath><linearGradient id="p-coat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a3957"/><stop offset=".55" stop-color="#131c30"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <linearGradient id="p-belly" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce8fb"/>
  </linearGradient>
  <linearGradient id="p-flip" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34466b"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <linearGradient id="p-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <radialGradient id="p-shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#0b1220" stop-opacity=".35"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#fc)">
<rect width="1280" height="170" fill="url(#fs)"/>
<path d="M0 128 Q160 118 320 128 T640 128 T960 128 T1280 128 V170 H0 Z" fill="#1e3a8a" opacity=".5">
 <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 128 Q160 118 320 128 T640 128 T960 128 T1280 128 V170 H0 Z;M0 128 Q160 138 320 128 T640 128 T960 128 T1280 128 V170 H0 Z;M0 128 Q160 118 320 128 T640 128 T960 128 T1280 128 V170 H0 Z"/></path>
