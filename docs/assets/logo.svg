<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
  </linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a3957"/><stop offset=".55" stop-color="#131c30"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <linearGradient id="belly" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce8fb"/>
  </linearGradient>
  <linearGradient id="flip" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34466b"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#0b1220" stop-opacity=".35"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
<!-- speed streaks -->
<g stroke="#fff" stroke-linecap="round" fill="none">
  <path d="M60 226 H170" stroke-width="28" opacity=".95"/>
  <path d="M92 298 H164" stroke-width="28" opacity=".7"/>
  <path d="M76 370 H160" stroke-width="28" opacity=".45"/>
</g>
<!-- ground shadow (not rotated) -->
<ellipse cx="312" cy="462" rx="118" ry="16" fill="url(#shadow)"/>
<g transform="rotate(14 300 300)">
  <!-- feet: tucked under the body so they connect -->
  <path d="M244 430 c-8 20 2 30 18 30 h46 c9 0 10 -9 3 -15 l-22 -22 z" fill="url(#orange)"/>
  <path d="M300 432 c-8 20 2 30 18 30 h46 c9 0 10 -9 3 -15 l-22 -22 z" fill="url(#orange)"/>
  <!-- coat -->
  <path d="M306 84
           C368 84 404 130 406 188
           C408 234 394 262 398 300
           C404 382 372 452 296 456
           C226 460 186 414 184 356
           C182 300 206 262 214 212
           C226 136 252 84 306 84 Z" fill="url(#coat)"/>
  <!-- belly: starts at the chin, chest line curves down and back -->
  <path d="M402 214
           C400 246 394 266 396 300
           C400 380 368 438 298 440
           C254 441 230 410 232 368
           C234 324 262 300 290 284
           C330 262 372 250 402 214 Z" fill="url(#belly)"/>
  <!-- soft shadow the flipper casts on the belly -->
  <path d="M258 292 C244 336 238 382 244 424 C270 396 286 352 290 306 Z" fill="#0b1220" opacity=".22"/>
  <!-- chin shadow: head sits over the chest -->
  <path d="M402 214 C372 250 330 262 292 284 C330 270 372 262 400 240 Z" fill="#0b1220" opacity=".16"/>
  <!-- flipper: swept back, with a lit leading edge for volume -->
  <path d="M244 256
           C214 296 192 350 186 412
           C218 392 256 346 272 300
           C278 280 262 250 244 256 Z" fill="url(#flip)"/>
  <path d="M246 262 C224 296 206 340 196 392" stroke="#5a6f96" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- beak: upper and lower mandible -->
  <path d="M396 166 C428 168 454 180 466 194 C446 196 420 194 398 190 Z" fill="url(#orange)"/>
  <path d="M398 192 C420 196 444 198 460 198 C448 208 424 212 400 206 Z" fill="#ea580c"/>
  <!-- eye -->
  <circle cx="358" cy="160" r="19" fill="#fff"/>
  <circle cx="364" cy="162" r="10" fill="#0b1220"/>
  <circle cx="367" cy="158" r="3.6" fill="#fff"/>
</g>
</svg>
