  <text x="74" y="198" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Cantarell, Arial, sans-serif" font-size="27" font-weight="500" fill="#f0f9ff" opacity=".95">Low-latency remote desktop between Windows and Fedora.</text>
  <text x="74" y="234" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Cantarell, Arial, sans-serif" font-size="27" font-weight="500" fill="#f0f9ff" opacity=".95">No port forwarding. Works behind CGNAT.</text>
