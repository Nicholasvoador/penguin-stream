<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Penguin Stream: low-latency remote desktop for Windows and Fedora">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a" stop-opacity=".55"/><stop offset="1" stop-color="#1e1b4b" stop-opacity=".85"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="card"><rect width="1280" height="380" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="380" fill="url(#sky)"/>
  <ellipse cx="260" cy="40" rx="320" ry="90" fill="#a5f3fc" opacity=".35" filter="url(#blur)"/>
  <ellipse cx="900" cy="70" rx="260" ry="70" fill="#c4b5fd" opacity=".35" filter="url(#blur)"/>
  <!-- distant icebergs -->
  <path d="M0 300 L70 250 L120 272 L190 220 L260 290 L340 262 L420 300 Z" fill="#e0f2fe" opacity=".35"/>
  <path d="M760 300 L820 262 L870 280 L930 240 L1010 300 Z" fill="#e0f2fe" opacity=".3"/>
  <!-- sea -->
  <path d="M0 300 Q160 288 320 300 T640 300 T960 300 T1280 300 V380 H0 Z" fill="url(#sea)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 300 Q160 288 320 300 T640 300 T960 300 T1280 300 V380 H0 Z;M0 300 Q160 312 320 300 T640 300 T960 300 T1280 300 V380 H0 Z;M0 300 Q160 288 320 300 T640 300 T960 300 T1280 300 V380 H0 Z"/>
  </path>
  <!-- ice floe -->
